plugins {
    id 'fabric-loom' version "${loom_version}"
}

def sharedProperties = new Properties()
file('../../gradle.properties').withInputStream { sharedProperties.load(it) }
group = 'dev.gamblingitems'
version = sharedProperties.getProperty('version')

base {
    archivesName = 'gambling-items-fabric-1.21.1'
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    mods {
        gamblingitems {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "dev.gamblingitems:gambling-items-core:${version}"
    include "dev.gamblingitems:gambling-items-core:${version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

sourceSets {
    arenaGeometryTest {
        java.srcDirs = ['src/client/java', 'src/arenaGeometryTest/java']
        java.include '**/ArenaMesh.java', '**/ArenaMeshTest.java'
    }
}
tasks.register('verifyArenaGeometry', JavaExec) {
    dependsOn tasks.named('arenaGeometryTestClasses')
    classpath = sourceSets.arenaGeometryTest.runtimeClasspath
    mainClass = 'dev.gamblingitems.fabric.client.ArenaMeshTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn tasks.named('verifyArenaGeometry') }

processResources {
    inputs.property 'version', project.version
    inputs.property 'arenaMixinRefmap', 'client-gambling-items-fabric-1.21.1-refmap.json'
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
    // Loom generates the client refmap; NeoForge uses Mojang names and the shared source config.
    filesMatching('gamblingitems.client.mixins.json') {
        filter { line -> line.replace('"required": true,', '"required": true, "refmap": "client-gambling-items-fabric-1.21.1-refmap.json",') }
    }
}

// Building the adapter also verifies the shared rules.
tasks.named('check') {
    dependsOn gradle.includedBuild('gambling-items-core').task(':check')
}

fabricApi.configureTests {
    createSourceSet = true
    modId = 'gamblingitems_test'
    enableGameTests = true
    enableClientGameTests = false
    eula = false
    clearRunDirectory = false
}

loom.runs.gameTest {
    property 'fabric-api.gametest.report-file', file('build/test-results/gametest.xml').absolutePath
}

tasks.named('runGameTest') {
    doFirst { file('build/test-results').mkdirs() }
}

tasks.named('jar') {
    from('../../LICENSE')
}

tasks.register('prepareCurseForge') {
    group = 'distribution'
    description = 'Build and verify the mod, then prepare its CurseForge upload folder.'
    dependsOn tasks.named('build')
    doLast {
        def jarFile = tasks.named('remapJar').get().archiveFile.get().asFile
        def fields = new groovy.json.JsonSlurper().parse(file('../../release/curseforge/project-fields.json'))
        assert fields.file.path == jarFile.name : 'Update the CurseForge file metadata for this version'
        def metadata
        def nested
        new java.util.zip.ZipFile(jarFile).withCloseable { archive ->
            metadata = new groovy.json.JsonSlurper().parse(archive.getInputStream(archive.getEntry('fabric.mod.json')))
            assert metadata.version == project.version.toString()
            assert metadata.authors == ['Romalaure']
            assert metadata.license == 'All Rights Reserved'
            assert metadata.depends.minecraft == '1.21.1'
            assert archive.getEntry(metadata.icon) != null
            assert archive.getEntry('LICENSE') != null
            assert archive.getEntry('dev/gamblingitems/fabric/client/GamblingItemsClient.class') != null
            assert archive.getEntry('dev/gamblingitems/fabric/GamblingItemsFabric.class') != null
            nested = metadata.jars.collect { it.file }
            assert nested.size() == 1 && nested[0].contains('gambling-items-core')
            assert archive.getEntry(nested[0]) != null
            assert !archive.entries().toList().any {
                it.name.contains('GameTests') || it.name.endsWith('.java') || it.name.startsWith('config/')
            }
        }
        def destination = file("../../dist/curseforge/${project.version}")
        destination.mkdirs()
        copy {
            from jarFile
            from '../../release/curseforge'
            from '../../LICENSE'
            from '../../ITEMS_AND_VALUES.md'
            into destination
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        jarFile.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int length
            while ((length = stream.read(buffer)) != -1) digest.update(buffer, 0, length)
        }
        def sha = digest.digest().encodeHex().toString()
        new File(destination, 'SHA256SUMS.txt').text = "${sha}  ${jarFile.name}\n"
        def report = [version: project.version.toString(), file: jarFile.name, bytes: jarFile.length(),
                      sha256: sha, metadata: metadata, embeddedLibraries: nested,
                      verification: ['Gradle build and core tests passed', 'Fabric server GameTests passed',
                                     'Production JAR metadata, client classes, license and nested core checked'],
                      notVerified: ['Manual client gameplay and visual smoke test', 'CurseForge moderation'],
                      published: false]
        new File(destination, 'verification.json').text = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(report)) + '\n'
        logger.lifecycle("CurseForge upload folder: ${destination}")
    }
}
