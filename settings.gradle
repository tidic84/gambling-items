rootProject.name = 'gambling-items-core'

// Only load Minecraft tooling when a platform task is requested from this build.
// The Fabric build already includes this core, so do not include it again from a child build.
def fabricTasks = ['runClient', 'runServer', 'buildFabric', 'prepareCurseForge']
def neoForgeTasks = ['runNeoForgeClient', 'runNeoForgeServer', 'buildNeoForge']
def requested = { List<String> tasks ->
    gradle.parent == null && gradle.startParameter.taskNames.any { tasks.contains(it.tokenize(':').last()) }
}
if (requested(fabricTasks)) {
    includeBuild('platforms/fabric-1.21.1') {
        name = 'fabric-1.21.1'
    }
}
// The NeoForge build compiles the core from source and does not include this build back.
if (requested(neoForgeTasks)) {
    includeBuild('platforms/neoforge-1.21.1') {
        name = 'neoforge-1.21.1'
    }
}
